name: Live smoke tests

# Manual only: these tests call real services (and may cost money). Never triggered by pull requests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test:live
        env:
          OPENBLOG_LIVE_OPENROUTER_API_KEY: ${{ secrets.OPENBLOG_LIVE_OPENROUTER_API_KEY }}
          OPENBLOG_LIVE_OPENROUTER_MODEL: ${{ vars.OPENBLOG_LIVE_OPENROUTER_MODEL }}
          OPENBLOG_LIVE_MAX_COST_PER_RUN: ${{ vars.OPENBLOG_LIVE_MAX_COST_PER_RUN }}
          OPENBLOG_LIVE_OLLAMA_BASE_URL: ${{ secrets.OPENBLOG_LIVE_OLLAMA_BASE_URL }}
          OPENBLOG_LIVE_OLLAMA_MODEL: ${{ vars.OPENBLOG_LIVE_OLLAMA_MODEL }}
          OPENBLOG_LIVE_WORDPRESS_ENDPOINT: ${{ secrets.OPENBLOG_LIVE_WORDPRESS_ENDPOINT }}
          OPENBLOG_LIVE_WORDPRESS_USERNAME: ${{ secrets.OPENBLOG_LIVE_WORDPRESS_USERNAME }}
          OPENBLOG_LIVE_WORDPRESS_APPLICATION_PASSWORD: ${{ secrets.OPENBLOG_LIVE_WORDPRESS_APPLICATION_PASSWORD }}
          OPENBLOG_LIVE_GHOST_ENDPOINT: ${{ secrets.OPENBLOG_LIVE_GHOST_ENDPOINT }}
          OPENBLOG_LIVE_GHOST_ADMIN_API_KEY: ${{ secrets.OPENBLOG_LIVE_GHOST_ADMIN_API_KEY }}
