name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # 22 matches the audit environment, 20 matches docker/Dockerfile
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run check:deps
      - run: npm run check:docs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm test
      - run: npm run test:coverage
        continue-on-error: true # informational, no threshold yet

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f docker/Dockerfile -t openblogagent:ci .

      - name: Compose file is valid
        run: docker compose -f docker/docker-compose.yml config --quiet

      - name: Workspace packages resolve in the runner stage
        run: >-
          docker run --rm --entrypoint node openblogagent:ci
          -e "for (const name of ['config', 'logger', 'shared', 'graph', 'app']) require('@openblog/' + name)"

      - name: CLI entry point starts
        run: |
          docker run --rm openblogagent:ci --help | grep -q "Usage"

      - name: CLI rejects a missing topic with the usage exit code
        run: |
          set +e
          docker run --rm openblogagent:ci generate > /dev/null 2>&1
          test "$?" -eq 64

      - name: Container runs as a non-root user
        run: test "$(docker run --rm --entrypoint id openblogagent:ci -u)" != "0"

      - name: Data survives container recreation
        run: |
          docker volume create openblog-ci-data
          docker run --rm -v openblog-ci-data:/app/data --entrypoint sh openblogagent:ci -c 'echo kept > /app/data/probe'
          test "$(docker run --rm -v openblog-ci-data:/app/data --entrypoint cat openblogagent:ci /app/data/probe)" = "kept"
